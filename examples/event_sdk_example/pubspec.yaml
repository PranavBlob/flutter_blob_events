name: event_sdk_example
description: Example Flutter app for Event SDK (Pinpoint, HTTP endpoint, Adjust, Firebase, Amplitude).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  event_sdk: 0.1.0
  event_sdk_aws: 0.1.0
  aws_endpoint_sdk: 0.1.0
  event_sdk_adjust: 0.1.0
  event_sdk_firebase: 0.1.0
  event_sdk_amplitude: 0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
